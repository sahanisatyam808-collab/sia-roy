form{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}

input::placeholder{color:var(--dim)}

form button{background:linear-gradient(135deg,var(--me),var(--me2));color:#fff;border:0;border-radius:999px;padding:0 20px;font:inherit;font-weight:700;cursor:pointer}

function reply(t){
  let s=t.toLowerCase().trim().replace(/(.)\1{2,}/g,"$1");
  s=s.replace(/\b(kon|kaon|kaunn)\b/g,"kaun").replace(/\b(tera|tere|teri)\b/g,"tera");
  let m;
  if((m=s.match(/(?:mera naam|my name is|main hoon|i am|i'm)\s+([a-z\u0900-\u097f]+)/i))){
    user=m[1][0].toUpperCase()+m[1].slice(1);
    try{localStorage.setItem("billadon_user",user)}catch(e){}
    return "Mast naam hai, "+user+"! Ab se tujhe yahi bulaunga. 😎";
  }
  const mm=s.match(/\b(thor|toofan|dark|romantic|gali|gaali|family|parivaar|parivar|ghar|bf|boyfriend|gf|girlfriend|normal|default)\s*mode\b|\bmode\s*(thor|toofan|dark|romantic|gali|gaali|family|parivaar|parivar|ghar|bf|boyfriend|gf|girlfriend|normal|default)\b/);
  if(mm){const w=mm[1]||mm[2];const k=/thor|toofan/.test(w)?"thor":/dark|romantic/.test(w)?"dark":/gali|gaali/.test(w)?"gali":/family|parivaar|parivar|ghar/.test(w)?"family":/^(bf|boyfriend)$/.test(w)?"bf":/^(gf|girlfriend)$/.test(w)?"gf":"normal";applyMode(k);return MINTRO[k]}
  if(/^(mode|modes|mode badlo|mode change)$/.test(s))return "Modes: ⚡ 'thor mode', 🌚 'dark mode', 🤬 'gali mode', 👨‍👩‍👧‍👦 'family mode', 💙 'bf mode', 💖 'gf mode', 😚 'normal mode'. Avatar pe tap karke bhi mode badal sakta hai! 😎";
  if(riddle){
    const r=riddle;
    if(/(pata nahi|nahi pata|batao|bata do|answer|jawab|give up|hint)/.test(s)){riddle=null;return "Jawab tha: "+r.r+" 😏 Ek aur chahiye toh 'paheli' bol.";}
    if(r.a.some(k=>s.includes(k))){riddle=null;return "Waah "+nm()+"! Sahi jawab! 🎉 "+r.r+" Tu toh sach mein tez hai. 😈";}
    riddle=null;return "Galat! 😜 Sahi jawab: "+r.r+" Phir try karega? 'paheli' bol.";
  }
  const expr=s.replace(/^(calculate|calc|hisab|solve)\s*/,"").replace(/x/g,"*").replace(/÷/g,"/");
  if(/^[0-9+\-*/().%\s]+$/.test(expr)&&/\d/.test(expr)&&/[+\-*/%]/.test(expr)){
    try{const r=Function('"use strict";return ('+expr+')')();
      if(Number.isFinite(r))return expr+" = "+(Math.round(r*1e6)/1e6)+"\nMaths mein toh Don topper hai! 🤓"}catch(e){}
    return "Yeh hisab gadbad hai bhai, dobara likh.";
  }
  if(/^(aur|ek aur|phir se|again|more|aur sunao|next)\b/.test(s)&&last)return last();
  for(const [re,out] of rules){
    if(PERSONA[mode]&&re===rules[3][0]){const r=modeReply(s);if(r!==null){last=()=>modeReply(s);return r}}
    if(out==="MODE"){const r=modeReply(s);if(r!==null){last=()=>modeReply(s);return r}continue}
    if(re.test(s)){
      const f=typeof out==="function"?out:()=>pick(out);
      last=f;return f();
    }
  }
  last=null;
  if(mode!=="normal")return pick(MP[mode].fb);
  if(/\?\s*$/.test(t)||/^(kya|kyun|kaise|kaun|kab|kahan|kitna|why|what|how|when|who)\b/.test(s))
    return pick(["Sawal toh solid hai, "+nm()+"! Par iska pakka jawab mere paas nahi. Mere paas joke, shayari aur paheli hain. 😈","Hmm, sochne wala sawal hai. 🤔 Asli jawab ke liye Google ko pooch, mujhse shayari sun le. 😏"]);
  return pick(fallback);
}

function add(text,who){
  const d=document.createElement("div");
  d.className="m "+who;d.textContent=text;
  log.appendChild(d);log.scrollTop=log.scrollHeight;
  if(who==="bot"&&(mode==="thor"||mode==="normal"))zap();
  return d;
}
function zap(){document.body.classList.remove("flash");void document.body.offsetWidth;document.body.classList.add("flash")}
document.getElementById("av").onclick=()=>{const o=["normal","thor","dark","gali","family","bf","gf"];const k=o[(o.indexOf(mode)+1)%o.length];applyMode(k);add(MINTRO[k],"bot");if(k==="thor")zap()};
function send(t){
  t=t.trim();if(!t)return;
  add(t,"me");q.value="";
  const ty=add("...","bot typing");
  const out=reply(t);
  setTimeout(()=>{ty.remove();add(out,"bot")},400+Math.min(out.length*12,900)+Math.random()*300);
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();send(q.value)});

});
